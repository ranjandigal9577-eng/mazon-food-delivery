<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e23744"><link rel="manifest" href="/manifest.webmanifest">
<title>MAZON — Food Delivery</title>
<script src="/socket.io/socket.io.js"></script><script>if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(()=>{});</script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#f7f7f7;color:#222}header{position:sticky;top:0;z-index:5;background:#fff;padding:12px 5%;display:flex;gap:10px;align-items:center;border-bottom:1px solid #eee}.logo{font-size:28px;font-weight:900;color:#e23744}.search{flex:1;padding:12px;border:1px solid #ddd;border-radius:25px}.wrap{max-width:1150px;margin:auto;padding:24px 5%}.bar{display:flex;gap:8px;flex-wrap:wrap}.btn{padding:10px 15px;border:0;border-radius:9px;font-weight:700;cursor:pointer}.red{background:#e23744;color:#fff}.white{background:#fff;border:1px solid #ddd}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:#fff;padding:15px;border-radius:14px;box-shadow:0 2px 8px #ddd}.pic{font-size:55px;text-align:center;padding:18px;background:#f1f1f1;border-radius:10px}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;overflow:auto}.box{background:#fff;max-width:600px;margin:5vh auto;padding:24px;border-radius:14px}.field{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:8px}.item{padding:12px 0;border-bottom:1px solid #eee}.status{background:#eee;padding:5px 9px;border-radius:15px;font-size:12px}.tabs button{margin:3px}.panel{display:none}.panel.active{display:block}#map{height:280px;border-radius:12px;margin:10px 0}.muted{color:#777}.danger{color:#b00020}.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:#eee;margin:3px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
</style></head><body>
<header><div class=logo>MAZON</div><input id=search class=search placeholder="Search food or restaurant"><button class="btn white" onclick="loginBox()">Account</button><button class="btn red" onclick="cartBox()">🛒 <span id=count>0</span></button></header>
<div class=wrap>
<div class=top><div><h1>Food delivered to your door 🍔</h1><p class=muted>MAZON — food delivery marketplace.</p></div><button class="btn white" onclick="locate()">📍 Use my location</button></div>
<div class=bar><button class="btn white" onclick="setcat('All')">All</button><button class="btn white" onclick="setcat('Biryani')">Biryani</button><button class="btn white" onclick="setcat('Pizza')">Pizza</button><button class="btn white" onclick="setcat('Burger')">Burger</button><button class="btn white" onclick="setcat('Chinese')">Chinese</button><button class="btn white" onclick="setcat('Indian')">Indian</button></div>
<h2>Popular food</h2><div id=grid class=grid></div>
<h2>My orders</h2><div id=orders></div>
<div id=dashboard></div>
</div>

<div id=login class=modal><div class=box><button class="btn white" onclick="closeBox('login')">Close</button><h2>Login / Register</h2>
<input id=name class=field placeholder="Name"><input id=phone class=field placeholder="Mobile number"><input id=pass class=field type=password placeholder="Password">
<select id=role class=field><option value=customer>Customer</option><option value=restaurant>Restaurant</option><option value=delivery>Delivery Partner</option></select>
<div class=card style="margin-top:10px"><b>WhatsApp OTP</b><input id=otp class=field placeholder="6-digit OTP"><button class="btn white" onclick="requestOtp()">Send OTP on WhatsApp</button> <button class="btn white" onclick="verifyOtp()">Verify OTP</button><p id=otpmsg></p></div>
<div class=bar><button class="btn red" onclick="login()">Login</button><button class="btn white" onclick="register()">Create account</button></div><p id=msg></p>
</div></div>

<div id=cart class=modal><div class=box><button class="btn white" onclick="closeBox('cart')">Close</button><h2>Your Cart</h2><div id=items></div><h3>Total ₹<span id=total>0</span></h3>
<textarea id=address class=field placeholder="Delivery address"></textarea><button class="btn white" onclick="locate()">📍 Fill location</button>
<div id=map></div><select id=pay class=field><option value=COD>Cash on Delivery</option><option value=UPI>UPI payment</option></select>
<div id=upiInfo class=card style="display:none"><b>MAZON UPI</b><br><span id="upiId">ranjaldigal-4@oksbi</span><br><small>Use your UPI app to pay. MAZON must verify payment before marking an order as paid.</small></div>
<button class="btn red" style="width:100%" onclick="order()">Place order</button><p id=cmsg></p></div></div>

<script>
let otpVerified=false,foods=[],cart=[],cat="All",token=localStorage.mazonToken||"",me=null,coords={lat:null,lng:null};const $=x=>document.getElementById(x);const socket=io();
async function api(u,o={}){o.headers={...(o.headers||{}),...(token?{Authorization:"Bearer "+token}:{})};if(o.body&&typeof o.body!="string"){o.headers["Content-Type"]="application/json";o.body=JSON.stringify(o.body)}let r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error||"Failed");return d}
async function load(){foods=await api("/api/foods");draw();if(token){try{me=await api("/api/me");renderDashboard();loadOrders()}catch(e){token="";localStorage.removeItem("mazonToken")}}}
function draw(){let q=$("search").value.toLowerCase();let d=foods.filter(x=>(cat=="All"||x.category==cat)&&(x.name+" "+x.restaurant).toLowerCase().includes(q));$("grid").innerHTML=d.map(x=>`<div class=card><div class=pic>${x.emoji}</div><h3>${x.name}</h3><p>${x.restaurant}</p><small>${x.description||""}</small><p><b>₹${x.price}</b><button class="btn red" style="float:right" onclick="add(${x.id})">ADD</button></p></div>`).join("")}
$("search").oninput=draw;function setcat(x){cat=x;draw()}function add(id){let f=foods.find(x=>x.id==id);if(cart.length&&cart[0].restaurant_id!==f.restaurant_id)return alert("MAZON orders can contain food from one restaurant at a time.");cart.push({...f,qty:1});update();cartBox()}
function update(){$("count").textContent=cart.reduce((a,x)=>a+x.qty,0);$("items").innerHTML=cart.map((x,i)=>`<div class=item>${x.emoji} ${x.name} — ₹${x.price} <button class="btn white" onclick="cart[${i}].qty++;update()">+</button> <button class="btn white" onclick="cart[${i}].qty--;if(cart[${i}].qty<=0)cart.splice(${i},1);update()">−</button></div>`).join("")||"Empty";$("total").textContent=cart.reduce((a,x)=>a+x.price*x.qty,0)}
function loginBox(){$("login").style.display="block"}function cartBox(){update();$("cart").style.display="block";setTimeout(()=>{if(coords.lat)initMap()},100)}function closeBox(x){$(x).style.display="none"}
async function login(){if(!otpVerified)return alert("Verify your phone with WhatsApp OTP first.");try{let d=await api("/api/auth/login",{method:"POST",body:{phone:$("phone").value,password:$("pass").value}});token=d.token;me=d.user;localStorage.mazonToken=token;closeBox("login");renderDashboard();loadOrders();alert("Welcome "+d.user.name)}catch(e){$("msg").textContent=e.message}}
async function register(){if(!otpVerified)return alert("Verify your phone with WhatsApp OTP first.");try{let d=await api("/api/auth/register",{method:"POST",body:{name:$("name").value,phone:$("phone").value,password:$("pass").value,role:$("role").value}});token=d.token;me=d.user;localStorage.mazonToken=token;closeBox("login");renderDashboard();alert("Account created")}catch(e){$("msg").textContent=e.message}}
async function order(){if(!token)return alert("Please login first.");if(!cart.length)return alert("Cart is empty.");if(!$("address").value)return alert("Enter delivery address.");try{
 let payload={restaurantId:cart[0].restaurant_id,items:cart.map(x=>({id:x.id,name:x.name,price:x.price,qty:x.qty})),total:cart.reduce((a,x)=>a+x.price*x.qty,0),address:$("address").value,lat:coords.lat,lng:coords.lng,paymentMethod:$("pay").value};
 let r=await api("/api/orders",{method:"POST",body:payload});
 if(payload.paymentMethod==="UPI"){
   let cfg=await api("/api/config");
   // Prefer the configured Razorpay flow when available.
   if(cfg.razorpay){
     let p=await api("/api/payments/create-order",{method:"POST",body:{amount:r.total}});
     await new Promise((resolve,reject)=>{let rz=new Razorpay({key:p.key_id||"",amount:p.amount,currency:p.currency,order_id:p.id,name:"MAZON",description:"Food order #MZ"+r.id,handler:async function(resp){try{await api("/api/payments/verify",{method:"POST",body:{orderId:r.id,razorpay_order_id:resp.razorpay_order_id,razorpay_payment_id:resp.razorpay_payment_id,razorpay_signature:resp.razorpay_signature}});resolve()}catch(e){reject(e)}},modal:{ondismiss:()=>reject(Error("Payment cancelled"))}});rz.open()});
   } else {
     let p=await api("/api/payments/upi?amount="+encodeURIComponent(r.total)+"&orderId="+encodeURIComponent(r.id));
     if(confirm("Pay ₹"+r.total+" to "+p.upi_id+" using your UPI app?")){
       window.location.href=p.upi_uri;
       alert("Complete the UPI payment. MAZON will mark the order PAID only after verified gateway/payment confirmation.");
     } else throw Error("Payment cancelled");
   }
 }
 cart=[];update();closeBox("cart");alert("Order #MZ"+r.id+" placed");loadOrders();
}catch(e){$("cmsg").textContent=e.message}}
async function loadOrders(){if(!token)return;try{let a=await api("/api/orders");$("orders").innerHTML=a.map(o=>`<div class=card style="margin:10px 0"><b>#MZ${o.id}</b> · ${o.restaurant} · ₹${o.total}<br><span class=status>${o.status}</span> <span class=pill>${o.payment_status}</span><br>${o.address}<br><button class="btn white" onclick="track(${o.id})">Track</button></div>`).join("")||"No orders yet."}catch(e){}}
async function track(id){let o=await api("/api/orders/"+id);socket.emit("joinOrder",id);let ev=await api("/api/orders/"+id+"/events");alert("Order #MZ"+id+" is "+o.status+"\\n"+ev.map(x=>x.status).join(" → "))}
function locate(){if(!navigator.geolocation)return alert("Location is not supported.");navigator.geolocation.getCurrentPosition(p=>{coords={lat:p.coords.latitude,lng:p.coords.longitude};$("address").value=$("address").value||`GPS location (${coords.lat.toFixed(5)}, ${coords.lng.toFixed(5)})`;initMap()},e=>alert("Please allow location access in your browser."))}
let map,marker;function initMap(){if(!window.L||!coords.lat)return;map=map||L.map("map").setView([coords.lat,coords.lng],15);if(!map._mazon){L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap"}).addTo(map);map._mazon=true}if(marker)marker.setLatLng([coords.lat,coords.lng]);else marker=L.marker([coords.lat,coords.lng]).addTo(map);map.setView([coords.lat,coords.lng],15)}
function renderDashboard(){if(!me)return;$("dashboard").innerHTML=`<div class=card><h2>${me.role==="customer"?"Customer":me.role==="restaurant"?"Restaurant":"Delivery Partner"} dashboard</h2><p>${me.name} · ${me.phone}</p><button class="btn white" onclick="logout()">Logout</button>${me.role==="restaurant"?'<div id=restPanel></div>':me.role==="delivery"?'<div id=delPanel></div>':''}</div>`;if(me.role==="restaurant")restaurantPanel();if(me.role==="delivery")deliveryPanel();if(me.role==="admin")adminPanel()}
function logout(){token="";me=null;localStorage.removeItem("mazonToken");$("dashboard").innerHTML="";$("orders").innerHTML="";alert("Logged out")}
async function restaurantPanel(){let a=await api("/api/orders");$("restPanel").innerHTML=`<h3>Restaurant orders</h3>`+a.map(o=>`<div class=card><b>#MZ${o.id}</b> ₹${o.total} — ${o.status}<br><button class="btn white" onclick="setStatus(${o.id},'ACCEPTED')">Accept</button> <button class="btn white" onclick="setStatus(${o.id},'PREPARING')">Preparing</button> <button class="btn white" onclick="setStatus(${o.id},'READY')">Ready</button></div>`).join("")}
async function deliveryPanel(){let a=await api("/api/orders");$("delPanel").innerHTML=`<h3>Delivery jobs</h3>`+a.map(o=>`<div class=card><b>#MZ${o.id}</b> ${o.restaurant} — ${o.status}<br><small>${o.address}</small><br><button class="btn white" onclick="setStatus(${o.id},'PICKED_UP')">Pick up</button> <button class="btn white" onclick="setStatus(${o.id},'OUT_FOR_DELIVERY')">Out for delivery</button> <button class="btn red" onclick="setStatus(${o.id},'DELIVERED')">Delivered</button><button class="btn white" onclick="sendLocation(${o.id})">📍 Send location</button></div>`).join("")}
async function setStatus(id,status){try{await api("/api/orders/"+id+"/status",{method:"PATCH",body:{status}});loadOrders();if(me.role==="restaurant")restaurantPanel();else deliveryPanel()}catch(e){alert(e.message)}}
async function sendLocation(id){if(!navigator.geolocation)return; navigator.geolocation.getCurrentPosition(async p=>{try{await api("/api/orders/"+id+"/location",{method:"POST",body:{lat:p.coords.latitude,lng:p.coords.longitude}});alert("Location updated")}catch(e){alert(e.message)}})}
async function adminPanel(){let s=await api("/api/admin/stats");$("dashboard").innerHTML+=`<div class=card><h3>Admin dashboard</h3><p>Revenue: ₹${s.revenue}</p><p>Users: ${s.users.map(x=>x.role+" "+x.count).join(" · ")}</p><p>Orders: ${s.orders.map(x=>x.status+" "+x.count).join(" · ")}</p></div>`}
async function requestOtp(){try{let d=await api("/api/auth/request-whatsapp-otp",{method:"POST",body:{phone:$("phone").value}});$("otpmsg").textContent=d.error||"OTP requested";}catch(e){$("otpmsg").textContent=e.message}}
async function verifyOtp(){try{let d=await api("/api/auth/verify-whatsapp-otp",{method:"POST",body:{phone:$("phone").value,code:$("otp").value}});otpVerified=!!d.verified;$("otpmsg").textContent=otpVerified?"WhatsApp OTP verified":"Not verified";}catch(e){$("otpmsg").textContent=e.message}}
socket.on("order:update",()=>{loadOrders();if(me?.role==="restaurant")restaurantPanel();if(me?.role==="delivery")deliveryPanel()});
load();
</script></body></html>
